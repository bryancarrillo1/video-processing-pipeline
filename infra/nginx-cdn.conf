# The CDN stand-in (PROJECT_OVERVIEW "CDN"): an edge cache in front of Blob
# Storage. Players fetch manifests and segments here; a miss is fetched from
# storage once and then served from the cache.
#
# Everything it serves is immutable (attempt-scoped renditions, versioned
# master manifests), so entries never need invalidating: storage sends
# `Cache-Control: max-age=31536000, immutable` and nginx honors it.

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:10m max_size=2g inactive=7d use_temp_path=off;

# Docker's DNS, re-resolved at runtime: the edge keeps working if the storage
# container restarts with a new IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    # Public content, so any origin may read it (the player fetches with XHR).
    # Expose-Headers lets page JS read X-Cache-Status for the HIT/MISS badge.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "X-Cache-Status, Content-Length" always;
    add_header X-Cache-Status $upstream_cache_status always;
    # Lets the player see transfer sizes (Resource Timing), so it can tell a
    # segment served from the browser's own cache from one the edge served.
    add_header Timing-Allow-Origin "*" always;

    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin "*";
      add_header Access-Control-Allow-Methods "GET, HEAD";
      add_header Access-Control-Allow-Headers "*";
      add_header Access-Control-Max-Age 86400;
      return 204;
    }
    # A read-only edge.
    limit_except GET HEAD { deny all; }

    # Anonymous to the origin: the edge can serve only what storage itself
    # makes public (the media buckets). Originals stay private.
    set $origin http://s3:8333;
    proxy_pass $origin;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Origin "";
    # CORS is answered here, once, not per cached copy of storage's reply.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_ignore_headers Vary Set-Cookie;

    proxy_cache media;
    # Query strings can't create duplicate entries or bypass the cache.
    proxy_cache_key $uri;
    # Only used when storage sends no Cache-Control. A 404 is cached briefly so
    # a burst of requests for a missing key doesn't stampede storage.
    proxy_cache_valid 200 10m;
    proxy_cache_valid 404 1s;
    # Many viewers missing on the same new segment: one origin fetch, the rest wait for it.
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    # If storage is down, keep serving what the edge already has.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
  }
}
